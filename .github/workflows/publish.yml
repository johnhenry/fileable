name: Publish to npm

on:
  release:
    types: [published]
  push:
    # Redundant with the release trigger above -- observed once, real and
    # reproducible: creating a release very soon after a push/merge to the
    # same commit can cause GitHub to silently drop the `release` event for
    # a job whose body is `uses: <external-repo>/...@v1` (confirmed by
    # re-testing the exact same release, well after any recent push, which
    # fired correctly). `gh release create` also creates the underlying git
    # tag, so this tag-push trigger gives the workflow a second, independent
    # chance to fire. Safe to double-fire: the publish step's idempotent
    # `npm view` guard makes a second run a clean no-op.
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # required by the reusable workflow's provenance step --
        # see johnhenry/workflows' README for why this must be declared here too.
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      gate-commands: npm test
    secrets: inherit
